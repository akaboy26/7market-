body{font-family:"Trebuchet MS",Verdana,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:4.5rem}

.muted{color:var(--mute);font-size:.88rem}

.post,.box{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1rem;margin-bottom:1rem}
.pic{height:11rem;border-radius:3px;background:linear-gradient(135deg,var(--line),var(--card));display:flex;align-items:center;justify-content:center;color:var(--mute);margin:.5rem 0;overflow:hidden}

.b.wa,.ok{background:var(--wa)}.no{background:var(--red)}

label{display:block;margin:.6rem 0 .2rem;font-size:.9rem}
.tabs{display:flex;gap:2px;border-bottom:3px solid var(--btn);margin-top:.8rem}

.tag{display:inline-block;font-size:.78rem;padding:.1rem .5rem;border-radius:10px;background:var(--line);color:var(--ink)}

.ph{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.ph img{width:6rem;height:6rem;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--bar);color:#fff;padding:.7rem 1.1rem;border-radius:4px;max-width:90vw;z-index:9}

    pays.forEach(function(p){var it=h("div","item");add(it,h("b","",((S.sel[p.seller_id]||{}).name||"Vendedor")+" – "+p.amount+" MT"),h("span","muted"," · ref. "+p.ref)," ",
      btn("Confirmar",async function(){chk(await sb.rpc("confirm_payment",{pid:p.id}));toast("Pagamento confirmado.");render();},"ok"));box.appendChild(it);});}
  add(box,h("h3","","Publicações por aprovar"));
  var pend=chk(await sb.from("products").select("*").eq("status","pendente").order("created_at"));
  if(!pend.length)box.appendChild(h("p","muted","Nada por aprovar."));
  pend.forEach(function(p){var it=h("div","item");add(it,h("b","",p.name+" ("+((S.sel[p.seller_id]||{}).name||"Vendedor")+")"),h("span","muted"," · "+money(p.price))," ",
    btn("Aprovar",async function(){chk(await sb.from("products").update({status:"ativo"}).eq("id",p.id));toast("Publicado.");render();},"ok")," ",
    btn("Recusar",async function(){chk(await sb.from("products").update({status:"recusado"}).eq("id",p.id));render();},"no"));box.appendChild(it);});
  add(box,h("h3","","Denúncias"));
  var rp=chk(await sb.from("reports").select("id, comment_id, comments(body)").order("created_at"));
  if(!rp.length)box.appendChild(h("p","muted","Sem denúncias."));
  rp.forEach(function(r){var it=h("div","item");add(it,h("p","",r.comments?r.comments.body:"(comentário apagado)"),
    btn("Apagar comentário",async function(){chk(await sb.from("comments").delete().eq("id",r.comment_id));toast("Apagado.");render();},"no")," ",
    btn("Manter",async function(){chk(await sb.from("reports").delete().eq("id",r.id));render();},"ghost"));box.appendChild(it);});
  return box;
}

var V={feed:vFeed,prod:vProd,seller:vSeller,login:vLogin,dash:vDash,publish:vPublish,pay:vPay,msgs:vMsgs,admin:vAdmin};
var busy=0;
async function render(){
  var k=++busy;chrome();
  try{var el=await V[S.view]();if(k!==busy)return;app.textContent="";app.appendChild(el);}
  catch(e){if(k!==busy)return;app.textContent="";app.appendChild(h("p","muted","Não foi possível carregar: "+(e.message||e)));}
}
(async function(){
  try{var t=localStorage.getItem("7m-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}
  if(SB_URL.indexOf("COLE_AQUI")===0){chrome();app.appendChild(h("p","box","Falta pôr o Project URL do Supabase no início do ficheiro (variável SB_URL)."));return;}
  sb=supabase.createClient(SB_URL,SB_KEY);
  var s=await sb.auth.getSession();S.user=s.data.session?s.data.session.user:null;await loadProfile();await loadSellers().catch(function(){});
  sb.auth.onAuthStateChange(function(ev,sess){var u=sess?sess.user:null;if((u&&u.id)===(S.user&&S.user.id)&&ev!=="SIGNED_OUT")return;
    S.user=u;setTimeout(async function(){await loadProfile();await loadSellers().catch(function(){});render();},0);});
  render();
})();
</script>
